<div id="authScreen"></div>

<div id="appScreen" class="shell hidden">
  <aside class="sidebar" id="sidebar">
    <div class="sb-brand">
      <span class="crest"><img src="./icons/logo.png" alt="Logo" style="width:100%;height:100%;object-fit:cover;border-radius:12px;display:block"/></span>
      <div>
        <div class="t">Masjid e Mohammadi</div>

      </div>
    </div>
    <nav id="nav"></nav>
    <div class="sb-spacer"></div>
    <div class="sb-foot">
      <div id="syncStatus">Cloud sync: initializing...</div>
      <div id="pendingStatus" class="muted small" style="margin-top:4px"></div>
      <div style="margin-top:6px;display:flex;gap:6px;flex-wrap:wrap">
        <button class="btn ghost sm" type="button" onclick="if(typeof fbMigrateLocal==='function')fbMigrateLocal()">Upload old data from this device</button>
        <button class="btn ghost sm" type="button" onclick="if(typeof fbLogout==='function')fbLogout()">Logout</button>
      </div>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <button class="icon-btn burger" id="burger" aria-label="Open menu" onclick="openSidebar()">

    <option value="en">English</option>
    <option value="hi">Hinglish</option>
    <option value="ta">Tamil</option>
    <option value="ur">اردو</option>
  </select>
      <div class="user-chip" id="userChip"></div>
    </header>
    <main class="content" id="content"></main>

</div>

<script src="vendor/jsQR.js" defer></script>
<script src="app.js" defer></script>
<script>
  /* app khud update hota rahe — naya version aate hi reload */
  if ('serviceWorker' in navigator) {
    var hadSW = !!navigator.serviceWorker.controller;
    var reloading = false;
    navigator.serviceWorker.addEventListener('controllerchange', function () {
      if (!hadSW || reloading) return;
      reloading = true;
      location.reload();
    });
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then(function (reg) {
        function check(){ try { reg.update(); } catch (e) {} }
        setInterval(check, 5 * 60 * 1000);                       /* har 5 minute */
        document.addEventListener('visibilitychange', function () { if (!document.hidden) check(); });
        window.addEventListener('focus', check);
      }).catch(function () {});
    });
  }
</script>
</body>
